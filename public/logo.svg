<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" fill="none">
  <defs>
    <!-- Clip path to keep water waves and bubbles strictly inside the round drum window -->
    <clipPath id="drumWindowClip">
      <circle cx="200" cy="150" r="66" />
    </clipPath>
  </defs>

  <!-- 1. OFFICIAL APP BADGE / SQUIRCLE -->
  <rect x="90" y="30" width="220" height="220" rx="58" fill="#0d2639" />

  <!-- Top-left indicators -->
  <circle cx="138" cy="74" r="7.5" fill="#24bcd7" />
  <circle cx="163" cy="74" r="7.5" fill="#f59e0b" />

  <!-- Top-right dispenser drawer slot -->
  <rect x="224" y="67" width="54" height="15" rx="7.5" fill="#173b54" />

  <!-- Drum window background (clipped) -->
  <circle cx="200" cy="150" r="66" fill="#0a1f2e" />

  <!-- Drum interior graphics with clip -->
  <g clip-path="url(#drumWindowClip)">
    <!-- Bubbles -->
    <circle cx="162" cy="114" r="3.2" fill="#ffffff" />
    <circle cx="180" cy="128" r="7.2" stroke="#ffffff" stroke-width="2.2" fill="none" />
    <circle cx="217" cy="120" r="5" stroke="#ffffff" stroke-width="2" fill="none" />

    <!-- Water waves (dual tone) -->
    <!-- Wave 1: lighter cyan top wave -->
    <path 
      d="M 125 162 C 145 138 175 186 205 168 C 225 156 245 168 275 162 L 275 225 L 125 225 Z" 
      fill="#30c6e0" 
    />
    <!-- Wave 2: deeper ocean cyan lower wave -->
    <path 
      d="M 125 178 C 150 160 178 196 210 182 C 235 170 255 182 275 178 L 275 225 L 125 225 Z" 
      fill="#1491ab" 
    />
  </g>

  <!-- Porthole Door cyan outer ring -->
  <circle cx="200" cy="150" r="66" stroke="#24bcd7" stroke-width="9.5" fill="none" />

  <!-- Bottom machine accents / buttons -->
  <rect x="168" y="234" width="26" height="5.5" rx="2.75" fill="#24bcd7" />
  <rect x="206" y="234" width="26" height="5.5" rx="2.75" fill="#24bcd7" />

  <!-- 2. BRAND TYPOGRAPHY -->
  <!-- "LaundroPOS" -->
  <g id="brand-text">
    <text 
      x="200" 
      y="350" 
      text-anchor="middle" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="54" 
      font-weight="800" 
      letter-spacing="-0.5px"
    >
      <tspan fill="#0d2639">Laundro</tspan><tspan fill="#24bcd7">POS</tspan>
    </text>

    <!-- "by Navya Ventures" -->
    <text 
      x="200" 
      y="396" 
      text-anchor="middle" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="22" 
      font-weight="500" 
      letter-spacing="3.8px" 
      fill="#526e82"
    >
      by Navya Ventures
    </text>
  </g>
</svg>
