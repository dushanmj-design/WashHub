kind: Project
name: cycleon-pos
environments:
  - name: local
---
kind: Module
name: cycleon-app
type: container
include:
  - Dockerfile
  - package.json
  - package-lock.json
  - src/**/*
  - server.ts
  - vite.config.ts
services:
  - name: cycleon-app
    ports:
      - name: http
        containerPort: 3000
        servicePort: 3000
